<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Experience — Dimitra Dimitriou</title>

  <!-- Fonts matching your site -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Ciclo is self-hosted; closest Google fallback for display: using Cinzel as placeholder
       but we'll @font-face Ciclo the same way your site does via the CDN pattern -->
  <link href="https://fonts.googleapis.com/css2?family=Switzer:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    /* ── Ciclo via same pattern as your main site ── */
    @font-face {
      font-family: 'Ciclo';
      src: url('https://dimitradimitriou.github.io/Ciclo-Regular.woff2') format('woff2'),
           url('https://dimitradimitriou.github.io/Ciclo-Regular.woff')  format('woff');
      font-weight: 400;
      font-style: normal;
    }

    /* ── Tokens — AR cyan palette matching work-3 AR section ── */
    :root {
      --bg:       #040d12;
      --surface:  #071318;
      --border:   #0e2028;
      --green:    #00d4ff;
      --text:     #e8e0d0;
      --muted:    #2a5060;
      --dim:      #0d2530;
    }

    /* ── AR portal canvas ── */
    #ar-portal-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Switzer', -apple-system, sans-serif;
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
      cursor: none;
    }

    /* ── Custom cursor ── */
    .cursor {
      position: fixed;
      width: 10px;
      height: 10px;
      background: var(--green);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.1s ease, width 0.3s ease, height 0.3s ease, opacity 0.3s ease;
      mix-blend-mode: difference;
    }

    .cursor-ring {
      position: fixed;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(126,203,161,0.4);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: transform 0.18s ease, width 0.3s ease, height 0.3s ease, opacity 0.3s ease;
    }

    body.cursor-hover .cursor       { width: 16px; height: 16px; }
    body.cursor-hover .cursor-ring  { width: 52px; height: 52px; border-color: rgba(126,203,161,0.7); }

    /* ── Film grain ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9990;
      opacity: 0.55;
    }

    /* ── Nav ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      padding: 1.8rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: rgba(10,15,13,0.9);
      backdrop-filter: blur(14px);
    }

    .nav-back {
      font-family: 'Switzer', sans-serif;
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.3s;
    }
    .nav-back:hover { color: var(--green); }

    .nav-label {
      font-family: 'Switzer', sans-serif;
      font-size: 0.66rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Hero ── */
    .hero {
      padding: 16rem 3rem 6rem;
      max-width: 860px;
      margin: 0 auto;
      text-align: left;
      position: relative;
      z-index: 2;
    }

    .hero-eyebrow {
      font-family: 'Switzer', sans-serif;
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--green);
      margin-bottom: 2.2rem;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.15s forwards;
    }

    .hero-index {
      font-family: 'Switzer', sans-serif;
      font-size: 0.66rem;
      letter-spacing: 0.2em;
      color: var(--muted);
      margin-bottom: 1rem;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.25s forwards;
    }

    .hero-title {
      font-family: 'Ciclo', 'Georgia', serif;
      font-size: clamp(3rem, 8vw, 6.5rem);
      font-weight: 400;
      line-height: 1.0;
      letter-spacing: -0.01em;
      color: var(--text);
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.35s forwards;
    }

    .hero-title em {
      font-style: italic;
      color: var(--green);
    }

    .hero-desc {
      font-family: 'Switzer', sans-serif;
      font-size: 0.9rem;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.06em;
      line-height: 1.7;
      max-width: 380px;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.5s forwards;
    }

    .hero-rule {
      width: 1px;
      height: 72px;
      background: linear-gradient(to bottom, var(--green), transparent);
      margin-top: 3.5rem;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.7s forwards;
    }

    /* ── Grid ── */
    .grid-section {
      padding: 5rem 3rem 10rem;
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    .section-label {
      font-family: 'Switzer', sans-serif;
      font-size: 0.66rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.8s forwards;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
    }

    /* ── Card ── */
    .card {
      position: relative;
      cursor: none;
      overflow: hidden;
      background: var(--surface);
    }

    .card-inner {
      position: relative;
      width: 100%;
    }

    .poster-img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform 0.7s ease;
    }

    .card:hover .poster-img { transform: scale(1.03); }
    .card.playing .poster-img { transform: scale(1); }

    .card-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .card.playing .card-video { opacity: 1; }

    /* ── Overlay ── */
    .card-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.6rem;
      background: linear-gradient(
        to bottom,
        rgba(10,15,13,0.55) 0%,
        transparent 30%,
        transparent 55%,
        rgba(10,15,13,0.8) 100%
      );
      transition: opacity 0.4s ease;
      z-index: 2;
    }

    .card.playing .card-overlay { opacity: 0; pointer-events: none; }

    .card-number {
      font-family: 'Switzer', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      color: rgba(126,203,161,0.55);
    }

    .card-bottom { display: flex; flex-direction: column; gap: 0.3rem; }

    .card-name {
      font-family: 'Ciclo', Georgia, serif;
      font-size: clamp(1rem, 1.8vw, 1.4rem);
      font-weight: 400;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .card-tag {
      font-family: 'Switzer', sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--green);
      opacity: 0.75;
    }

    /* ── Play button ── */
    .play-ring {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
      pointer-events: none;
      transition: opacity 0.4s;
      opacity: 0;
    }

    .card:hover .play-ring { opacity: 1; }
    .card.playing .play-ring { opacity: 0; }

    .play-circle {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 1px solid rgba(126,203,161,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10,15,13,0.45);
      backdrop-filter: blur(6px);
      transition: transform 0.3s, border-color 0.3s;
    }

    .card:hover .play-circle {
      transform: scale(1.08);
      border-color: var(--green);
    }

    .play-circle svg {
      width: 18px;
      height: 18px;
      fill: var(--green);
      margin-left: 3px;
    }

    /* ── Pause hint ── */
    .pause-hint {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .card.playing:hover .pause-hint { opacity: 1; pointer-events: auto; }

    .pause-circle {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 1px solid rgba(126,203,161,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10,15,13,0.5);
      backdrop-filter: blur(6px);
    }

    .pause-circle svg {
      width: 16px;
      height: 16px;
      fill: var(--green);
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 2.5rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .footer-left {
      font-family: 'Switzer', sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .footer-right {
      font-family: 'Switzer', sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; gap: 2px; }
      nav { padding: 1.4rem 1.5rem; }
      .hero { padding: 10rem 1.5rem 4rem; }
      .grid-section { padding: 3rem 1.5rem 6rem; }
      footer { flex-direction: column; gap: 1rem; text-align: center; }
      body { cursor: auto; }
      .cursor, .cursor-ring { display: none; }
    }
  </style>
</head>
<body>

<!-- Custom cursor -->
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<!-- AR portal background canvas -->
<canvas id="ar-portal-canvas"></canvas>

<nav>
  <a class="nav-back" href="https://dimitradimitriou.github.io/work-3.html">← All Work</a>
  <span class="nav-label">Dimitra Dimitriou</span>
</nav>

<section class="hero">
  <p class="hero-eyebrow">05 — AR Experience · Motion Design</p>
  <p class="hero-index">Augmented Reality</p>
  <h1 class="hero-title">Through the<br><em>Looking Glass</em></h1>
  <p class="hero-desc">Three Tim Burton worlds. One frame. Tap to enter each dimension.</p>
  <div class="hero-rule"></div>
</section>

<section class="grid-section">
  <p class="section-label">Selected works — 2025</p>
  <div class="grid" id="gallery"></div>
</section>

<footer>
  <span class="footer-left">© 2026 Dimitra Dimitriou</span>
  <span class="footer-right">Augmented Reality — Motion Design</span>
</footer>

<script>
  /* ── Cursor ── */
  const cursor     = document.getElementById('cursor');
  const cursorRing = document.getElementById('cursorRing');
  let mx = -100, my = -100, rx = -100, ry = -100;

  document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

  (function animCursor() {
    rx += (mx - rx) * 0.14;
    ry += (my - ry) * 0.14;
    cursor.style.left     = mx + 'px';
    cursor.style.top      = my + 'px';
    cursorRing.style.left = rx + 'px';
    cursorRing.style.top  = ry + 'px';
    requestAnimationFrame(animCursor);
  })();

  document.querySelectorAll('a, .card').forEach(el => {
    el.addEventListener('mouseenter', () => document.body.classList.add('cursor-hover'));
    el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hover'));
  });

  /* ── Gallery ── */
  const projects = [
    {
      number: "01",
      name: "Alice in Wonderland",
      tag: "Through the Looking Glass",
      poster: "AliceDD.png",
      video:  "Dimitra_Dimitriou_Alice_AR.mp4"
    },
    {
      number: "02",
      name: "Beetlejuice",
      tag: "It's Showtime",
      poster: "BeetlejuiceDD.png",
      video:  "Dimitra_Dimitriou_Beetlejuice_AR.mp4"
    },
    {
      number: "03",
      name: "Jack Skellington",
      tag: "The Nightmare Before Christmas",
      poster: "JackDD.png",
      video:  "Dimitra_Dimitriou_JSkellinghton_AR.mp4"
    }
  ];

  const gallery = document.getElementById('gallery');

  projects.forEach(({ number, name, tag, poster, video }) => {
    const card = document.createElement('div');
    card.className = 'card';

    card.innerHTML = `
      <div class="card-inner">
        <img class="poster-img" src="${poster}" alt="${name}" loading="lazy" />
        <video class="card-video" src="${video}" loop playsinline preload="none"></video>

        <div class="card-overlay">
          <span class="card-number">${number}</span>
          <div class="card-bottom">
            <div class="card-name">${name}</div>
            <div class="card-tag">${tag}</div>
          </div>
        </div>

        <div class="play-ring">
          <div class="play-circle">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>

        <div class="pause-hint">
          <div class="pause-circle">
            <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </div>
        </div>
      </div>
    `;

    const vid = card.querySelector('video');

    card.addEventListener('click', () => {
      const isPlaying = card.classList.contains('playing');

      document.querySelectorAll('.card.playing').forEach(c => {
        c.classList.remove('playing');
        c.querySelector('video').pause();
      });

      if (!isPlaying) {
        card.classList.add('playing');
        vid.play();
      }
    });

    vid.addEventListener('ended', () => card.classList.remove('playing'));

    gallery.appendChild(card);
  });
</script>
<script>
  /* ══════════════════════════════════
     AR PORTAL CANVAS — viewfinder rings
  ══════════════════════════════════ */
  (()=>{
    const canvas = document.getElementById('ar-portal-canvas');
    const ctx    = canvas.getContext('2d');
    let W, H;

    const resize = () => {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    };
    resize();
    window.addEventListener('resize', resize);

    const RINGS = [
      { rf: 0.38, spd:  0.18, op: 0.40, lw: 1.0, dash: [6,14],  phase: 0   },
      { rf: 0.32, spd: -0.28, op: 0.28, lw: 0.7, dash: [3,22],  phase: 1.1 },
      { rf: 0.26, spd:  0.42, op: 0.45, lw: 1.1, dash: [12,8],  phase: 0.5 },
      { rf: 0.20, spd: -0.55, op: 0.25, lw: 0.6, dash: [2,18],  phase: 2.0 },
      { rf: 0.14, spd:  0.70, op: 0.38, lw: 0.8, dash: [8,6],   phase: 0.8 },
      { rf: 0.08, spd: -0.90, op: 0.50, lw: 0.5, dash: [4,10],  phase: 1.6 },
      { rf: 0.44, spd:  0.06, op: 0.14, lw: 0.5, dash: [],      phase: 0   },
    ];

    const TICKS = 36;
    const BRK   = 28;
    let scanY   = 0;
    let t       = 0;

    (function loop() {
      requestAnimationFrame(loop);
      t += 0.008;

      ctx.clearRect(0, 0, W, H);

      /* Portal anchored to upper-right quadrant — floats behind the hero */
      const cx   = W * 0.78;
      const cy   = H * 0.42;
      const baseR = Math.min(W, H) * 0.30;

      /* Radial glow */
      const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseR * 1.2);
      glow.addColorStop(0,   'rgba(0,212,255,0.05)');
      glow.addColorStop(0.5, 'rgba(0,140,200,0.03)');
      glow.addColorStop(1,   'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(cx, cy, baseR * 1.2, 0, Math.PI * 2);
      ctx.fill();

      /* Rings */
      RINGS.forEach(ring => {
        const r      = baseR * ring.rf;
        const ang    = t * ring.spd + ring.phase;
        const pulseOp = ring.op + Math.sin(t * 1.4 + ring.phase) * 0.10;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(ang);
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(0,212,255,${pulseOp})`;
        ctx.lineWidth   = ring.lw;
        ring.dash.length ? ctx.setLineDash(ring.dash) : ctx.setLineDash([]);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
      });

      /* Tick marks */
      const outerR = baseR * 0.44;
      for (let i = 0; i < TICKS; i++) {
        const ang     = (i / TICKS) * Math.PI * 2 + t * 0.06;
        const isMajor = i % 6 === 0;
        const tickLen = isMajor ? 10 : 5;
        const op      = isMajor ? 0.50 : 0.18;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(ang) * outerR,             cy + Math.sin(ang) * outerR);
        ctx.lineTo(cx + Math.cos(ang) * (outerR + tickLen), cy + Math.sin(ang) * (outerR + tickLen));
        ctx.strokeStyle = `rgba(0,212,255,${op})`;
        ctx.lineWidth   = isMajor ? 1.2 : 0.6;
        ctx.stroke();
      }

      /* Crosshair */
      const dotPulse = 0.45 + Math.sin(t * 2.2) * 0.28;
      ctx.beginPath();
      ctx.arc(cx, cy, 3, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0,212,255,${dotPulse})`;
      ctx.fill();

      [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy]) => {
        ctx.beginPath();
        ctx.moveTo(cx + dx * 6,        cy + dy * 6);
        ctx.lineTo(cx + dx * (6 + 14), cy + dy * (6 + 14));
        ctx.strokeStyle = 'rgba(0,212,255,0.38)';
        ctx.lineWidth   = 0.8;
        ctx.stroke();
      });

      /* Corner brackets */
      const bx1 = cx - outerR - 16, by1 = cy - outerR - 16;
      const bx2 = cx + outerR + 16, by2 = cy + outerR + 16;
      [[bx1,by1,1,1],[bx2,by1,-1,1],[bx2,by2,-1,-1],[bx1,by2,1,-1]].forEach(([x,y,sx,sy]) => {
        ctx.beginPath();
        ctx.moveTo(x + sx * BRK, y);
        ctx.lineTo(x, y);
        ctx.lineTo(x, y + sy * BRK);
        ctx.strokeStyle = 'rgba(0,212,255,0.28)';
        ctx.lineWidth   = 1.2;
        ctx.setLineDash([]);
        ctx.stroke();
      });

      /* Scanline sweep */
      scanY = ((t * 55) % (outerR * 2));
      const scanAbsY = cy - outerR + scanY;
      if (scanAbsY > cy - outerR && scanAbsY < cy + outerR) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, outerR, 0, Math.PI * 2);
        ctx.clip();
        const sg = ctx.createLinearGradient(cx - outerR, scanAbsY, cx + outerR, scanAbsY);
        sg.addColorStop(0,   'rgba(0,212,255,0)');
        sg.addColorStop(0.3, 'rgba(0,212,255,0.05)');
        sg.addColorStop(0.5, 'rgba(0,212,255,0.12)');
        sg.addColorStop(0.7, 'rgba(0,212,255,0.05)');
        sg.addColorStop(1,   'rgba(0,212,255,0)');
        ctx.fillStyle = sg;
        ctx.fillRect(cx - outerR, scanAbsY - 1.5, outerR * 2, 3);
        ctx.restore();
      }

      /* Data labels */
      ctx.font = '9px Switzer, monospace';
      [
        { text: 'AR — ACTIVE',   x: cx + outerR + 20, y: cy - 14, op: 0.28 + Math.sin(t*1.1)*0.10 },
        { text: 'LAYER — 3',     x: cx + outerR + 20, y: cy -  1, op: 0.20 },
        { text: 'PORTAL — OPEN', x: cx + outerR + 20, y: cy + 12, op: 0.25 + Math.sin(t*0.8+1)*0.08 },
      ].forEach(l => {
        ctx.fillStyle = `rgba(0,212,255,${l.op})`;
        ctx.fillText(l.text, l.x, l.y);
      });

    })();
  })();

</body>
</html>
